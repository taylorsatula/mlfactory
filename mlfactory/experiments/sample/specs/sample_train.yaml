# Sample experiment — supervised fine-tuning stage.
# Consumes classifications.jsonl produced by the classify stage.

stage: train
name: sample-topic-finetune
experiment: sample

# Pick one input source:
# input_run: <classify-run-id>
# input_file: runs/<classify-run-id>/artifacts/classifications.jsonl

# Dependency-free smoke backend. This performs real gradient updates on a
# multinomial text classifier and writes a reloadable checkpoint.
backend: numpy_softmax
training:
  epochs: 100
  learning_rate: 0.5
  l2: 0.001
  min_frequency: 1
  seed: 42

# Keep all eight smoke records, including records labeled "error". For a real
# dataset, remove failed classifier outputs with: exclude_labels: [error]
exclude_labels: []

# Production causal-LM/LoRA example (requires `pip install -e '.[train]'`):

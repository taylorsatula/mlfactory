stage: stratify
name: deepseek-v4-baseten-101-110
experiment: ace

# Slice records 101-110 (0-indexed offset 100, length 10) from KEEP bucket.
input: /home/admin/ace-baseline-trajectories/outputs/full_run_buckets/KEEP.jsonl
offset: 100
max_records: 10

model: deepseek/deepseek-v4-pro
base_url: https://openrouter.ai/api/v1
api_key: "${secrets.ACE_STRATIFIER_API_KEY}"
temperature: 0.2
max_tokens: 4096

# Markdown prompt template; supports {extra_instructions} and {{PROBLEM}}/{{TRAJECTORY}}.
prompt: mlfactory/experiments/ace/prompts/stratify_system_prompt.md
extra_instructions: ""

# Route through Baseten provider on OpenRouter.
extra_body: '{"provider": {"order": ["Baseten"]}}'

retries: 3
backoff: 2.0
max_workers: 10
loop_delay: 0.0

env:
  HF_HOME: /home/admin/.cache/huggingface

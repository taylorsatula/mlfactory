[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfactory"
version = "0.1.0"
description = "Reproducible ML experiment factory"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.optional-dependencies]
remote = ["vastai>=1.5"]
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
]
all = [
    "vastai>=1.5",
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
]

[project.scripts]
mlfactory = "mlfactory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlfactory*"]
